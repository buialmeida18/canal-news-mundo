<script id="script-esportes-aovivo-normal">
(function(){const K="canal_news_mundo_esportes_live_url";const norm=u=>{u=(u||"").trim();if(!u)return"";const m=u.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);return m&&m[1]?"https://www.youtube.com/embed/"+m[1]+"?autoplay=1&rel=0":u;};const ehVid=u=>/\.(mp4|webm|ogg)(\?.*)?$/i.test(u);const emEsp=()=>{const h=decodeURIComponent(location.hash||"").toLowerCase(),pt=decodeURIComponent(location.pathname||"").toLowerCase(),sel=Array.from(document.querySelectorAll("select")).some(s=>((s.value||"").toLowerCase().includes("esporte")||(s.options&&s.selectedIndex>=0&&(s.options[s.selectedIndex].textContent||"").toLowerCase().includes("esporte"))));return h.includes("esporte")||pt.includes("esporte")||sel;};function init(){const p=document.getElementById("painel-esportes-aovivo");if(!p)return;const inp=p.querySelector("#input-link-jogo-aovivo"),bCar=p.querySelector("#btn-carregar-jogo-aovivo"),bLim=p.querySelector("#btn-limpar-jogo-aovivo"),box=p.querySelector("#box-player-esportes"),ext=p.querySelector("#link-externo-jogo-aovivo");let pos=false;function posOnce(){if(pos)return;const st=Array.from(document.querySelectorAll("div,span,p")).find(el=>(el.textContent||"").includes("Servidor conectado"));if(st&&st.parentNode&&st.nextSibling!==p){st.parentNode.insertBefore(p,st.nextSibling);pos=true;}}function rend(u){u=(u||"").trim();if(!u){box.innerHTML='<div class="aovivo-placeholder">Cole o link da transmissão acima e toque em <strong>Carregar Jogo</strong> para assistir direto na seção Esportes.</div>';ext.style.display="none";return;}const f=norm(u);ext.href=u;ext.style.display="inline-block";box.innerHTML=ehVid(f)?'<video src="'+f.replace(/"/g,"&quot;")+'" controls autoplay playsinline></video>':'<iframe src="'+f.replace(/"/g,"&quot;")+'" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>';}const sv=localStorage.getItem(K)||"";if(sv){inp.valu
