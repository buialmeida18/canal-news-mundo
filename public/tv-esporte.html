<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Esporte — Canal News Mundo</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#090d16;color:#f8fafc;padding:16px}
  .topo{max-width:600px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111827;padding:12px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.12)}
  .titulo{font-size:16px;font-weight:900;color:#fbbf24}
  .voltar{text-decoration:none;background:#dc2626;color:#fff;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:800}
  .box{max-width:600px;margin:0 auto;padding:16px;border-radius:20px;background:linear-gradient(180deg,#151c2c 0%,#0b101b 100%);border:2px solid #f59e0b;box-shadow:0 10px 28px rgba(0,0,0,.55)}
  .tela{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#05080f;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;text-align:center;padding:8px;box-sizing:border-box}
  .tela iframe,.tela video{width:100%;height:100%;border:0}
  .controles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .controles input{flex:1 1 200px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#090d16;color:#f8fafc;font-size:13px}
  .controles button{padding:10px 14px;border-radius:10px;border:0;background:#f59e0b;color:#090d16;font-weight:800;font-size:12px;cursor:pointer}
  .controles button.sec{background:#1e293b;color:#f8fafc;border:1px solid rgba(255,255,255,.16)}
  .rodape{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#cbd5e1;flex-wrap:wrap}
  .rodape a{color:#fbbf24;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="topo">
    <span class="titulo">TV Esporte</span>
    <a class="voltar" href="/">← Voltar para o canal</a>
  </div>
  <div class="box">
    <div class="tela" id="tvTela"><span>Carregando transmissão da TV Esporte...</span></div>
    <div class="controles" id="tvControles">
      <input type="text" id="tvLink" placeholder="Cole link do YouTube, live ou TikTok">
      <button type="button" id="tvCarregar">Carregar Jogo</button>
      <button type="button" class="sec" id="tvLimpar">Limpar</button>
    </div>
    <div class="rodape">
      <span>TV Esporte • Canal News Mundo</span>
      <a id="tvOriginal" href="#" target="_blank" rel="noopener" style="display:none">Abrir link original</a>
    </div>
  </div>
<script>
(()=>{
const K="cnm_esportes_live_url";
const tela=document.getElementById("tvTela");
const inp=document.getElementById("tvLink");
const orig=document.getElementById("tvOriginal");
const ytId=(u)=>{
  const s=(u||"").trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;
  const m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|live\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m?m[1]:"";
};
const ttId=(u)=>{
  const m=(u||"").match(/tiktok\.com\/@[^/]+\/(?:video|photo)\/(\d+)/);
  return m?m[1]:"";
};
const render=(url)=>{
  const u=(url||"").trim();
  localStorage.setItem(K,u);
  if(inp)inp.value=u;
  if(!u){
    tela.innerHTML="<span>Cole um link de jogo, transmissão ao vivo ou TikTok abaixo e clique em Carregar Jogo.</span>";
    if(orig)orig.style.display="none";
    return;
  }
  if(orig){orig.href=u;orig.style.display="inline";}
  if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(u)){
    tela.innerHTML='<video src="'+u.replace(/"/g,"&quot;")+'" controls playsinline></video>';
    return;
  }
  const yid=ytId(u);
  if(yid){
    tela.innerHTML='<iframe src="https://www.youtube.com/embed/'+yid+'?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
    return;
  }
  const tid=ttId(u);
  if(tid){
    tela.innerHTML='<iframe src="https://www.tiktok.com/embed/v2/'+tid+'" allow="encrypted-media; fullscreen" allowfullscreen></iframe>';
    return;
  }
  tela.innerHTML='<iframe src="'+u.replace(/"/g,"&quot;")+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
};
const btnCarregar=document.getElementById("tvCarregar");
const btnLimpar=document.getElementById("tvLimpar");
if(btnCarregar)btnCarregar.onclick=()=>render(inp?inp.value:"");
if(btnLimpar)btnLimpar.onclick=()=>render("");
render(localStorage.getItem(K)||"");
})();
</script>
</body>
</html>
